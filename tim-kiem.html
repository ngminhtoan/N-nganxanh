<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tìm kiếm sản phẩm — Nông Sản Xanh</title>
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/product.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/search.css">
<link rel="icon" type="image/png" href="img/logo-nong-san-xanh.png">

</head>
<body class="search-page">

<header class="site-header"><div id="site-header"></div></header>

<main class="search-section">
  <div class="wrap">
    <header class="search-heading">
      <span class="search-eyebrow">Nông Sản Xanh · Danh mục sản phẩm</span>
      <h1 id="search-title">Tìm kiếm sản phẩm</h1>
    </header>

    <form id="search-form" class="search-page-form">
      <label class="visually-hidden" for="search-input">Từ khóa tìm kiếm</label>
      <input type="search" id="search-input" placeholder="Tìm theo tên, danh mục, nguồn gốc, nhà vườn...">
      <button type="submit" class="btn">Tìm kiếm</button>
    </form>

    <div class="product-grid" id="search-grid"></div>

    <div class="state-box search-empty" id="search-empty" style="display:none;">
      <div class="glyph"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg></div>
      <p>Không tìm thấy sản phẩm phù hợp.</p>
      <a href="#" id="clear-search" class="btn btn-outline">Xóa bộ lọc</a>
    </div>
  </div>
</main>

<footer class="site-footer"><div id="site-footer"></div></footer>

<script type="module" src="js/pages/search.js"></script>
</body>
</html>
