<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập — Nông Sản Xanh</title>
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/cart.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="icon" type="image/png" href="img/logo-nong-san-xanh.png">

</head>
<body class="auth-page login-page">

<header class="site-header"><div id="site-header"></div></header>

<main class="auth-layout customer-auth">
  <section class="auth-story">
    <span class="auth-kicker">NÔNG SẢN CHẤT LƯỢNG CHỌN LỌC MỖI NGÀY</span>
    <h1>Nông sản chất lượng,<br><span class="auth-title-accent">an tâm chọn lựa.</span></h1>
    <p>Kết nối trực tiếp với nhà vườn và hợp tác xã, Mang đến các mặt hàng nông sản chất lượng từ khắp mọi miền Việt Nam.</p>
    <a class="auth-back-link" href="index.html">← Khám phá sản phẩm</a>
  </section>
  <section class="auth-panel">
    <a class="auth-panel-brand" href="index.html"><img src="img/logo-nong-san-xanh.png" alt="Nông Sản Xanh"></a>
    <h2>Đăng nhập</h2>
    <div class="auth-role-picker" role="group" aria-label="Chọn loại tài khoản">
      <button type="button" class="is-active" data-login-role="customer">Khách hàng</button>
      <button type="button" data-login-role="farm">HTX / Nhà vườn</button>
    </div>

  <div class="form-note" id="form-note"></div>

  <form id="login-form" novalidate>
    <div class="field">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" placeholder="ban@email.com">
      <div class="field-error"></div>
    </div>
    <div class="field">
      <label for="login-password">Mật khẩu</label>
      <input type="password" id="login-password" placeholder="Tối thiểu 6 ký tự">
      <div class="field-error"></div>
    </div>
    <button type="submit" class="btn btn-block">Đăng nhập</button>
  </form>

  <div class="auth-foot">Chưa có tài khoản? <a href="dang-ky.html">Đăng ký ngay</a></div>
  </section>
</main>

<footer class="site-footer"><div id="site-footer"></div></footer>

<script type="module" src="js/pages/auth.js"></script>
</body>
</html>
