<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đặt hàng — Nông Sản Việt</title>
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/product.css">
<link rel="stylesheet" href="css/cart.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="icon" type="image/png" href="img/logo-nong-san-xanh.png">

</head>
<body>

<header class="site-header"><div id="site-header"></div></header>

<section class="section">
  <div class="wrap">
    <div class="breadcrumb"><a href="index.html">Trang chủ</a> / <a href="gio-hang.html">Giỏ hàng</a> / Đặt hàng</div>
    <div class="section-head"><div><h2>Đặt hàng</h2></div></div>

    <div class="login-required-box" id="login-required">
      <div class="glyph" style="margin-bottom:14px;"><svg xmlns="http://www.w3.org/2000/svg" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-lock-keyhole" aria-hidden="true" style="display:inline-block; vertical-align:middle;"><circle cx="12" cy="16" r="1"/><rect x="3" y="10" width="18" height="12" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></svg></div>
      <p>Bạn cần đăng nhập để đặt hàng.</p>
      <a href="dang-nhap.html" class="btn">Đăng nhập ngay</a>
    </div>

    <div class="checkout-layout" id="checkout-content">
      <div>
        <div class="account-card">
          <h3>Thông tin nhận hàng</h3>
          <form id="checkout-form">
            <div class="field">
              <label for="co-name">Họ và tên</label>
              <input type="text" id="co-name">
            </div>
            <div class="field-row">
              <div class="field">
                <label for="co-phone">Số điện thoại</label>
                <input type="tel" id="co-phone">
              </div>
              <div class="field">
                <label for="co-address">Địa chỉ nhận hàng</label>
                <input type="text" id="co-address">
              </div>
            </div>
            <div class="field">
              <label for="co-note">Ghi chú (không bắt buộc)</label>
              <textarea id="co-note" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-block">Xác nhận đặt hàng</button>
          </form>
        </div>
      </div>

      <div>
        <div class="order-review" id="order-review"></div>
        <div class="summary-card">
          <div class="summary-row total"><span>Tổng thanh toán</span><span id="checkout-total">0đ</span></div>
        </div>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer"><div id="site-footer"></div></footer>

<script type="module" src="js/pages/checkout.js"></script>
</body>
</html>
