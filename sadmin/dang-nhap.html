<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập Quản trị hệ thống — Nông Sản Xanh</title>
<link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/cart.css">
<link rel="stylesheet" href="../css/theme.css">
<link rel="icon" type="image/png" href="../img/logo-nong-san-xanh.png">

</head>
<body class="auth-page admin-auth-page">

<main class="auth-layout admin-auth">
  <section class="auth-story">
    <span class="auth-kicker">KHÔNG GIAN VẬN HÀNH</span>
    <h1>Vững hệ thống,<br>an tâm mùa vụ.</h1>
    <p>Cổng quản trị dành riêng cho đội ngũ vận hành sàn Nông Sản Xanh.</p>
    <a class="auth-back-link" href="../index.html">← Trở về trang chính</a>
  </section>
  <section class="auth-panel">
    <a class="auth-panel-brand" href="../index.html"><img src="../img/logo-nong-san-xanh.png" alt="Nông Sản Xanh"></a>

    <h2>Đăng nhập hệ thống</h2>
   

  <div class="form-note" id="form-note"></div>

  <form id="sadmin-login-form" novalidate>
    <div class="field">
      <label for="sadmin-email">Email quản trị</label>
      <input type="email" id="sadmin-email" placeholder="admin@nongsanviet.vn">
    </div>
    <div class="field">
      <label for="sadmin-password">Mật khẩu</label>
      <input type="password" id="sadmin-password" placeholder="••••••••">
    </div>
    <button type="submit" class="btn btn-block">Đăng nhập quản trị</button>
  </form>

  <div class="auth-foot" style="font-size:.8rem;">
  <strong>admin@nongsanviet.vn</strong> / admin123
  </div>
  </section>
</main>

<script type="module" src="../js/sadmin/auth.js"></script>
</body>
</html>
